name: Update risk and spread
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: POWER grid points to refresh
        default: '75'
        required: false
      batch_index:
        description: Zero-based batch index
        default: '0'
        required: false
permissions:
  contents: write
concurrency:
  group: wildfire-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the 2-degree land grid
        run: python scripts/land_mask.py
      - name: Refresh weather and derived layers
        env:
          POWER_BATCH_SIZE: ${{ inputs.batch_size || '75' }}
          POWER_BATCH_INDEX: ${{ inputs.batch_index || github.run_number }}
        run: |
          python scripts/fetch_power_grid.py
          python scripts/compute_risk.py
          python scripts/compute_spread.py
          python scripts/validate.py
          python scripts/sync_docs_data.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: refresh risk model [skip ci]"
          git push
